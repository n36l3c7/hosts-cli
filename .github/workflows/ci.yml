name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck and mandoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        # zsh is needed for the syntax check of the zsh completion, which
        # cannot be exercised from bash and would otherwise skip itself.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck mandoc zsh
      - name: Lint
        run: make lint

  test:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        # acl provides setfacl, which the test for the refusal to drop an
        # extended ACL needs; without it that test skips itself.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bats acl
      - name: Test
        run: make test
