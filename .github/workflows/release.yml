name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag against VERSION
        # A tag that disagrees with the file is a mistake worth catching here
        # rather than after the package is published under the wrong number.
        run: |
          tag=${GITHUB_REF_NAME#v}
          declared=$(cat VERSION)
          if [ "$tag" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $declared" >&2
            exit 1
          fi

      - name: Build the package
        run: make deb

      - name: Install it and use it
        # Whether the package works matters more than whether it is elegant,
        # so it is installed for real and then exercised.
        run: |
          sudo dpkg --install build/hosts-cli_*_all.deb
          hosts --version
          hosts --file /etc/hosts ls >/dev/null
          test -f /usr/share/man/man1/hosts.1.gz
          test -f /usr/share/bash-completion/completions/hosts
          test -f /usr/share/zsh/site-functions/_hosts
          test -f /usr/share/doc/hosts-cli/copyright
          sudo dpkg --remove hosts-cli

      - name: Take the notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v want="$version" '
            $0 ~ "^## \\[" want "\\]" { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md >release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no changelog section for $version" >&2
            exit 1
          fi

      - name: Checksum the assets
        # Whoever installs from apt has the signature on the repository to go
        # by. Whoever downloads the script straight from the release page has
        # had nothing, until now.
        working-directory: build
        run: |
          sha256sum hosts hosts.1 hosts-cli_*_all.deb >SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "hosts ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            build/hosts \
            build/hosts.1 \
            build/hosts-cli_*_all.deb \
            build/SHA256SUMS
